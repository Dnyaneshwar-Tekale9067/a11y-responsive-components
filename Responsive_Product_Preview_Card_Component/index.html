<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <article class="product">
            <picture class="product__img">
                <source srcset="https://product-preview-card-wine-nine.vercel.app/img/image-product-desktop.jpg" media="(min-width: 600px)">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQirlw6X4AmUV-UF0WcH-WXYObjquSFunMm_F2lV5aeaT4FsbHTQ9DMyC0n&s=10"
                    alt="Gabrielle Essence Eau De Perfum">
            </picture>

            <div class="product_content">
                <p class="product_category">Prefume</p>

                <h1 class="product__title">Gabrielle Essence Eau De Perfum</h1>

                <p class="product_info">
                    A floral, solar and volumptuous interpretation composed by Olivier Polge,
                    Perfumer-Creater for the House of CHANEL..
                </p>

                <div class="flex-group">
                    <p class="product__price">
                        <span class="visually-hidden">Current price:</span>
                        $149.99
                    </p>
                    <p class="product__originel-price">
                        <span class="visually-hidden">Original price:</span>
                        <s>$169.99</s>
                    </p>

                </div>
                <button class="button" data-icon="shopping-cart">Add to cart</button>
            </div>

        </article>
    </main>
</body>

</html>
